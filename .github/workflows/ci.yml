name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running check pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the workflow only reads the code and uploads the build
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tip denetiminin artımlı önbelleği (tsconfig "incremental"): değişmeyen dosyalar yeniden denetlenmez
      - uses: actions/cache@v4
        with:
          path: node_modules/.tmp
          key: tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      # the same command a developer runs before pushing (package.json "ci")
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  # uçtan uca testler: derlenmiş site gerçek bir tarayıcıda (Playwright, Chromium) her adreste açılır,
  # kritik akışlar (Bakkal'ın ilk satışı, hata ve bilinmeyen adres ekranları, mobil İK) denenir
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
