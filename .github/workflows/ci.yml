name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running check pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the workflow only reads the code and uploads the build
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the same command a developer runs before pushing (package.json "ci")
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
