name: Pages

# Oyunu GitHub Pages'te yayınlar. Pages kaynak dosyaları (index.html → /src/main.tsx) değil,
# derlenmiş dist/ klasörünü sunmalı; yoksa sayfa boş açılır. Depo ayarı: Settings › Pages ›
# Build and deployment › Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# aynı anda tek yayın; süren bir yayın yarıda kesilmez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # paylaşım önizlemesi (og:image, canonical) için mutlak adres
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
